name: Interface and avatar regression checks
on:
  push:
    branches: [codex/desktop-beta-build-fixes]
    paths: ['web/**', 'web_backend/**', 'desktop/bundled_ui_manifest.js', 'scripts/interface*', '.github/workflows/interface-check.yml']
  pull_request:
    paths: ['web/**', 'web_backend/**', 'desktop/bundled_ui_manifest.js', 'scripts/interface*', '.github/workflows/interface-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated database and existing messenger checks
        run: |
          python scripts/interface_release_selftest.py
          python scripts/parent_message_scope_selftest.py
          node scripts/student_messenger_selftest.js
          node scripts/teacher_messenger_layout_selftest.js
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/adelia-ui-tests" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/adelia-ui-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Mobile and desktop browser interactions
        run: NODE_PATH="$RUNNER_TEMP/adelia-ui-tests/node_modules" node scripts/interface_browser_selftest.cjs
