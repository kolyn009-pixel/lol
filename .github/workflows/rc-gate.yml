name: Adelia RC gate

'on':
  workflow_dispatch:
  push:
    branches: [release/adelia-unified-rc]
    paths:
      - '**/*.py'
      - '.github/workflows/rc-gate.yml'

permissions:
  contents: read

jobs:
  python-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-telegram-bot>=20,<23" flask flask-cors requests openpyxl
      - name: Compile release source
        run: |
          python -m compileall -q core final_features handlers integrations scripts vk_adapter web_backend database.py
      - name: Import release web modules
        run: |
          python - <<'PY'
          import importlib
          modules = [
              'web_backend.teacher_day_off_state',
              'web_backend.student_self_service',
              'web_backend.student_reschedule',
              'web_backend.teacher_schedule_settings',
              'web_backend.teacher_lesson_actions',
              'final_features.slot_change',
          ]
          for name in modules:
              importlib.import_module(name)
              print('IMPORT OK:', name)
          PY
      - name: Teacher day-off isolated DB selftest
        run: python rc_day_off_selftest.py
      - name: Unified isolated release selftest
        run: python rc_release_selftest.py
