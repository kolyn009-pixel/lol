name: Assemble existing Adelia beta.5 bundles
on:
  pull_request:
    paths:
      - '.github/workflows/desktop-full-kit.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target: [windows-x64, macos-arm64, macos-x64]
    steps:
      - name: Fetch verified beta.5 bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p bundles
          name='Adelia-0.3.0-beta.5-${{ matrix.target }}-5050eb35a498.zip'
          id=$(gh api "repos/$GH_REPO/releases/421029183/assets" --jq '.[] | select(.name == "Adelia-0.3.0-beta.5-${{ matrix.target }}-5050eb35a498.zip") | .id')
          test -n "$id"
          gh api "repos/$GH_REPO/releases/assets/$id" -H 'Accept: application/octet-stream' > "bundles/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: beta5-complete-${{ matrix.target }}
          path: bundles/*.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
