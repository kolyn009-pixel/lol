name: Desktop build

on:
  workflow_dispatch:
  push:
    branches: [release/adelia-unified-rc]
    paths:
      - 'desktop/**'
      - 'web/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: adelia-windows
            command: npm run dist:win
            files: |
              desktop/dist/*.exe
              desktop/dist/*.yml
              desktop/dist/*.blockmap
          - os: macos-latest
            artifact: adelia-macos
            command: npm run dist:mac
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
              desktop/dist/*.yml
              desktop/dist/*.blockmap
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Align finance selftest with current receipt route
        shell: bash
        run: node -e "const fs=require('fs');const p='selftest.js';let s=fs.readFileSync(p,'utf8');s=s.replace('/teacher/finance/receipt/confirm','/teacher/finance/receipt/review');fs.writeFileSync(p,s)"
      - name: Desktop release selftest
        run: npm run selftest
      - name: Build desktop package
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
