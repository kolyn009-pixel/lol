name: Desktop beta build

on:
  workflow_dispatch:
  push:
    branches: [release/adelia-unified-rc]
    paths:
      - 'desktop/**'
      - 'web/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

concurrency:
  group: desktop-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: adelia-windows-x64
            command: npm run dist:win
            publish_args: --platform win
            files: |
              desktop/beta-bundle/**
          - os: macos-latest
            label: macOS Apple Silicon
            artifact: adelia-macos-arm64
            command: npm run dist:mac:arm64
            publish_args: --platform mac --arch arm64
            files: |
              desktop/beta-bundle/**
          - os: macos-latest
            label: macOS Intel
            artifact: adelia-macos-x64
            command: npm run dist:mac:x64
            publish_args: --platform mac --arch x64
            files: |
              desktop/beta-bundle/**

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Desktop release selftest
        run: npm run selftest

      - name: Build desktop installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Write beta manifest
        run: node write_beta_manifest.js

      - name: Prepare verified beta bundle
        shell: bash
        run: |
          rm -rf beta-bundle
          python publish_updates.py dist beta-bundle ${{ matrix.publish_args }}
          cp dist/beta-manifest.json beta-bundle/build-manifest.json

      - name: Verify beta bundle
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("beta-bundle")
          assert root.is_dir(), "beta bundle missing"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          build = json.loads((root / "build-manifest.json").read_text(encoding="utf-8"))

          assert manifest.get("files"), "publish manifest empty"
          assert build.get("git_sha") == "${{ github.sha }}", (build.get("git_sha"), "${{ github.sha }}")

          names = {p.name for p in root.iterdir() if p.is_file()}
          platform = "${{ runner.os }}"
          arch = "${{ matrix.label }}"
          if platform == "Windows":
              assert any(n.endswith(".exe") for n in names), names
              assert "Adelia-latest-windows-x64.exe" in names, names
          else:
              assert any(n.endswith(".dmg") for n in names), names
              assert any(n.endswith(".zip") for n in names), names
              expected = "Adelia-latest-macos-arm64.dmg" if "Apple Silicon" in arch else "Adelia-latest-macos-x64.dmg"
              assert expected in names, names

          print("BETA_BUNDLE_VERIFY=OK")
          print("GIT_SHA=${{ github.sha }}")
          print("FILES=", sorted(names))
          PY

      - name: Upload beta installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
