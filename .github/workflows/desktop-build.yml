name: Desktop beta build

on:
  workflow_dispatch:
  pull_request:
    branches: [release/adelia-unified-rc]
    paths:
      - 'desktop/**'
      - 'scripts/desktop_release_manager.sh'
      - 'rc_desktop_static_selftest.py'
      - 'vk_adapter/**'
      - 'homework_pdf_runtime.py'
      - 'scripts/vk_homework_ingest_selftest.py'
      - 'handlers/homework_v6.py'
      - 'handlers/homework_file_delivery.py'
      - 'scripts/telegram_homework_file_selftest.py'
      - 'web/student_messenger_v2.js'
      - 'web/student_boot.js'
      - 'web/app.js'
      - 'web/teacher_messages_stage10.js'
      - 'web/parent/**'
      - 'web_backend/parent_messages.py'
      - 'web_backend/stage9_api.py'
      - 'web_backend/stage10_api.py'
      - 'web_backend/unified_messaging.py'
      - 'web_backend/message_delivery.py'
      - 'web_backend/message_media.py'
      - 'web_backend/unified_messages.py'
      - 'scripts/parent_message_scope_selftest.py'
      - 'scripts/student_messenger_selftest.js'
      - 'scripts/homework_archive_selftest.py'
      - 'scripts/student_offline_selftest.js'
      - 'handlers/homework_channel_handlers.py'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

concurrency:
  group: desktop-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Actions runner preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check VK homework file persistence
        run: python scripts/vk_homework_ingest_selftest.py
      - name: Check Telegram homework file requests
        run: python scripts/telegram_homework_file_selftest.py
      - name: Check in-app messenger
        run: |
          node scripts/student_messenger_selftest.js
          node scripts/student_offline_selftest.js
          python scripts/homework_archive_selftest.py
          python scripts/parent_message_scope_selftest.py
          node --check web/parent/messenger.js
          node --check web/teacher_messages_stage10.js
      - name: Check legal step-up and homework archive
        run: |
          python scripts/legal_stepup_selftest.py
          python scripts/legal_documents_selftest.py
          PYTHONPATH=. python scripts/homework_attachment_web_selftest.py
          node scripts/teacher_messenger_layout_selftest.js
          node --check web/legal-admin.js
          node --check web/teacher_homework_detail_plus.js
      - name: Verify runner and desktop source
        shell: bash
        run: |
          node --version
          test -f desktop/package.json
          node -e "const p=require('./desktop/package.json'); console.log('DESKTOP_VERSION='+p.version)"
          echo "ACTIONS_PREFLIGHT=OK"

  build:
    needs: preflight
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: adelia-windows-x64
            command: npm run dist:win
            publish_args: --platform win
            files: |
              desktop/beta-bundle/**
          - os: macos-latest
            label: macOS Apple Silicon
            artifact: adelia-macos-arm64
            command: npm run dist:mac:arm64
            publish_args: --platform mac --arch arm64
            files: |
              desktop/beta-bundle/**
          - os: macos-latest
            label: macOS Intel
            artifact: adelia-macos-x64
            command: npm run dist:mac:x64
            publish_args: --platform mac --arch x64
            files: |
              desktop/beta-bundle/**

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Desktop release selftest
        run: npm run selftest

      - name: Build desktop installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prepare verified beta bundle
        shell: bash
        run: |
          rm -rf beta-bundle
          VERSION=$(node -p "require('./package.json').version")
          python publish_updates.py dist beta-bundle ${{ matrix.publish_args }} --channel beta --version "$VERSION" --git-sha "${{ github.sha }}"

      - name: Verify beta bundle
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("beta-bundle")
          assert root.is_dir(), "beta bundle missing"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))

          assert manifest.get("files"), "publish manifest empty"
          assert manifest.get("channel") == "beta", manifest
          assert str(manifest.get("version", "")).startswith("0.3.0-beta."), manifest
          assert manifest.get("git_sha") == "${{ github.sha }}", manifest
          assert (root / "release.json").is_file(), "release metadata missing"

          names = {p.name for p in root.iterdir() if p.is_file()}
          assert {item["name"] for item in manifest["files"]} <= names, "manifest references missing artifact"
          assert manifest["version"] == json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          platform = "${{ runner.os }}"
          arch = "${{ matrix.label }}"
          metadata = "beta.yml" if platform == "Windows" else "beta-mac.yml"
          assert metadata in names, (metadata, names)
          if platform == "Windows":
              assert any(n.endswith(".exe") for n in names), names
              assert "Adelia-latest-windows-x64.exe" in names, names
          else:
              assert any(n.endswith(".dmg") for n in names), names
              assert any(n.endswith(".zip") for n in names), names
              expected = "Adelia-latest-macos-arm64.dmg" if "Apple Silicon" in arch else "Adelia-latest-macos-x64.dmg"
              assert expected in names, names

          print("BETA_BUNDLE_VERIFY=OK")
          print("GIT_SHA=${{ github.sha }}")
          print("FILES=", sorted(names))
          PY

      - name: Upload beta installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
