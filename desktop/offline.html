ма попробует восстановить соединение.</p><div class="state"><i></i><span>Проверяю подключение…</span></div><button onclick="location.href='https://adeliatutor.ru/app/'">Попробовать сейчас</button><small>Ваши данные и вход в кабинет сохранятся.</small></main></body></html>
