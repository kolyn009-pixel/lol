<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка перед занятием — Аделия</title><link rel="stylesheet" href="device_check.css"></head><body><main class="device-shell"><header><div class="brand"><span>A</span><div><b>Аделия</b><small>Проверка перед занятием</small></div></div><button id="closeBtn" class="icon-btn" aria-label="Закрыть">×</button></header><section class="device-grid"><div class="preview-card"><div class="video-wrap"><video id="preview" autoplay muted playsinline></video><div id="videoEmpty" class="video-empty">Камера ещё не включена</div></div><div class="status-row"><span id="cameraStatus" class="status">Камера</span><span id="micStatus" class="status">Микрофон</span></div></div><div class="controls-card"><span class="eyebrow">Подготовка</span><h1>Проверьте камеру и микрофон</h1><p>Это локальная проверка. Изображение и звук никуда не отправляются.</p><label>Камера<select id="cameraSelect"></select></label><label>Микрофон<select id="micSelect"></select></label><div class="meter-block"><div class="meter-head"><span>Уровень микрофона</span><b id="meterText">0%</b></div><div class="meter"><i id="meterFill"></i></div></div><div id="message" class="message">Нажмите «Начать проверку», чтобы разрешить доступ к устройствам.</div><div class="actions"><button id="retryBtn" class="secondary">Начать проверку</button><button id="readyBtn" class="primary" disabled>Всё готово — к занятию</button></div></div></section></main><script src="device_check.js"></script></body></html>
