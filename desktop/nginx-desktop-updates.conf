# Include inside the adeliatutor.ru HTTPS server block after creating
# /var/www/adeliatutor/desktop-updates. This file is documentation/config only;
# it is not deployed automatically.
location ^~ /desktop-updates/ {
    alias /var/www/adeliatutor/desktop-updates/;
    autoindex off;
    try_files $uri =404;

    # Updater metadata must be revalidated so clients see new releases quickly.
    location ~* /desktop-updates/(latest|latest-mac)\.yml$ {
        alias /var/www/adeliatutor/desktop-updates/$1.yml;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Versioned installers/blockmaps never change after publication.
    location ~* \.(exe|dmg|zip|blockmap)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
