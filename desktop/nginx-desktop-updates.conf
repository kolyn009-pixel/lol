# Include inside the adeliatutor.ru HTTPS server block after creating
# /var/www/adeliatutor/desktop-updates. Live feeds are per target:
# {beta,stable}/{win-x64,macos-arm64,macos-x64} -> immutable release dirs.
# Keeping each target as a symlink makes publication and rollback atomic.
# This file is documentation/config only; it is not deployed automatically.
location ^~ /desktop-updates/ {
    alias /var/www/adeliatutor/desktop-updates/;
    autoindex off;
    try_files $uri =404;

    # Channel metadata must always be revalidated.
    location ~* ^/desktop-updates/(beta|stable)/(win-x64|macos-arm64|macos-x64)/(latest|latest-mac|beta|beta-mac)\.yml$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* ^/desktop-updates/(beta|stable)/(win-x64|macos-arm64|macos-x64)/(manifest|release)\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Versioned installers and blockmaps are immutable.
    location ~* \.(exe|dmg|zip|blockmap)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
