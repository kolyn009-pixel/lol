<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Главная — Аделия</title>
<link rel="icon" type="image/png" sizes="32x32" href="/app/assets/icons/adelia-mark-32.png">
<link rel="stylesheet" href="/app/tokens.css">
<link rel="stylesheet" href="/app/cabinet/cabinet.css?v=20261122-journal2">
<style>
.c-kids{display:flex;flex-wrap:wrap;gap:var(--space-1);margin:0 0 var(--space-3)}
.c-kids button{font:inherit;min-height:44px;padding:0 var(--space-2);background:none;border:1px solid var(--ink);color:var(--ink);cursor:pointer}
.c-kids button[aria-pressed="true"]{background:var(--ink);color:var(--surface,#fff)}
.c-kids button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body class="cab">
<noscript>Для работы кабинета нужен JavaScript.</noscript>
<script src="/app/parent/legal_gate.js?v=20261002-1"></script>
<script src="/app/cabinet/core.js?v=20261122-journal2"></script>
<script>
(function () {
  var P = '/app/parent/';
  var MENU = [
    { key: 'home', label: 'Главная', href: '/app/cabinet/parent.html', phone: true },
    { key: 'lessons', label: 'Занятия', href: '#lessons', phone: true },
    { key: 'pay', label: 'Оплата', href: '#payments', phone: true },
    { key: 'messages', label: 'Сообщения', href: C.legacy('parent', 'messages'), phone: true }
  ];
  var MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var FMT = { INDIVIDUAL: 'Индивидуально', GROUP: 'Группа', OPEN_EVENT: 'Событие' };
  var body, dash, sel = null, loading = false;

  function num(x) { var n = Number(x); return isFinite(n) ? n : 0; }
  function plural(n, a, b, c) { n = Math.abs(n) % 100; var k = n % 10; return n > 10 && n < 20 ? c : k > 1 && k < 5 ? b : k === 1 ? a : c; }
  function rub(n) { return new Intl.NumberFormat('ru-RU').format(n); }
  function when(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[3]) + ' ' + MON[+m[2] - 1] : ''; }
  function stats(list) {
    var st = C.el('div', 'c-stats');
    list.forEach(function (x) { var i = C.el('span', ''); i.append(x[0] + ' ', C.el('b', '', String(x[1]))); st.appendChild(i); });
    return st;
  }

  function lessonSection(kid) {
    var s = C.section('01', 'Ближайшее занятие'); s.id = 'lessons';
    var l = ((dash.upcoming) || []).filter(function (x) { return num(x.user_id) === num(kid.id); })[0];
    if (!l) { s.appendChild(C.empty('Ближайших занятий пока нет. Напишите Аделии, и мы подберём время.')); return s; }
    var row = C.el('div', 'c-row'), t = C.el('div', 'c-row-t');
    var tm = C.hhmm(l.start_time), te = C.hhmm(l.end_time), dt = when(l.start_time);
    t.appendChild(C.el('div', 'c-big', (dt ? dt + ', ' : '') + tm + (te ? '–' + te : '')));
    var meta = C.el('div', 'c-lesson-meta');
    meta.appendChild(C.el('span', 'c-tag', FMT[l.kind] || 'Занятие'));
    var sb = C.subjectLabel(l.subject); if (sb) meta.appendChild(C.el('span', '', sb));
    var g = C.subjectLabel(l.study_goal); if (g && g !== sb) meta.appendChild(C.el('span', '', g));
    var ps = C.payStatus(l.payment_status); if (ps) meta.appendChild(C.el('span', 'c-pay ' + ps.cls, ps.text));
    t.appendChild(meta); row.appendChild(t); s.appendChild(row); return s;
  }

  function attendSection(d) {
    var s = C.section('02', 'Посещаемость и домашние задания');
    var now = new Date(), ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    var rec = ((d.lessons && d.lessons.recent) || []).filter(function (x) { return String(x.start_time || '').slice(0, 7) === ym; });
    var done = rec.filter(function (x) { return String(x.lesson_status).toUpperCase() === 'COMPLETED'; }).length;
    var miss = rec.filter(function (x) { return /NO_SHOW|MISSED|ABSENT/i.test(String(x.lesson_status)); }).length;
    var up = num(d.lessons && d.lessons.upcoming);
    s.appendChild(C.el('p', 'c-row-s', 'Занятия в этом месяце'));
    s.appendChild(stats([['Проведено', done], ['Пропущено', miss], ['Впереди', up]]));
    var h = (d.progress && d.progress.homework) || {};
    s.appendChild(C.el('p', 'c-row-s', 'Домашние задания'));
    if (!num(h.total) && !num(h.assigned) && !num(h.submitted) && !num(h.completed)) { s.appendChild(C.empty('Заданий пока не было.')); return s; }
    var arr = [['Выдано', num(h.assigned)], ['Сдано', num(h.submitted)], ['Проверено', num(h.completed)]];
    if (num(h.overdue)) arr.push(['Просрочено', num(h.overdue)]);
    if (h.average_score != null) arr.push(['Средний результат', Math.round(num(h.average_score)) + '%']);
    s.appendChild(stats(arr)); return s;
  }

  function progSection(d) {
    var t = d.progress && d.progress.topics, goal = d.progress && d.progress.goal;
    if ((!t || !num(t.total)) && !goal) return null;
    var s = C.section('03', 'Прогресс по темам');
    if (t && num(t.total)) {
      s.appendChild(stats([['Тем', t.total], ['Начато', t.started], ['Освоено', t.mastered]]));
      var m = Math.max(0, Math.min(100, Math.round(num(t.average_mastery))));
      var r = C.el('div', 'c-topic'), h = C.el('div', 'c-topic-h');
      h.append(C.el('span', '', 'Средний уровень освоения'), C.el('span', '', m + '%'));
      var bar = C.el('div', 'c-bar cur'), i = document.createElement('i'); i.style.width = m + '%';
      bar.appendChild(i); bar.setAttribute('role', 'img'); bar.setAttribute('aria-label', 'Освоено ' + m + '%');
      r.append(h, bar); s.appendChild(r);
    }
    if (goal && (goal.target_text || goal.target_score)) {
      var gp = C.el('p', 'c-row-s', 'Цель: ' + (goal.target_text || ('балл ' + goal.target_score)) + (goal.target_date ? ' · к ' + when(goal.target_date) : ''));
      gp.style.marginTop = 'var(--space-2)'; s.appendChild(gp);
    }
    return s;
  }

  function paySection(d) {
    var s = C.section('04', 'Оплата и баланс'); s.id = 'payments';
    var tot = num(d.minute_balance && d.minute_balance.total);
    s.appendChild(C.el('div', 'c-big', tot + ' мин'));
    var n = Math.floor(tot / 60), sub = '≈ ' + n + ' ' + plural(n, 'занятие', 'занятия', 'занятий') + ' по 60 минут';
    var left = num(d.packages && d.packages.lessons_left); if (left > 0) sub += ' · в абонементе ' + left;
    s.appendChild(C.el('p', 'c-row-s', sub));
    var w = d.payment_summary || {};
    if (num(w.waiting_count) > 0) {
      var r = C.el('div', 'c-row'); r.appendChild(C.el('span', 'c-pay due', 'Ждёт оплата: ' + rub(num(w.waiting_amount)) + ' ₽'));
      r.appendChild(C.button('Оплатить', 'primary', C.classic(P))); s.appendChild(r);
    }
    return s;
  }

  function repSection(d) {
    var p = d.progress || {}, ex = (p.exam_results || []).slice(0, 3), dg = (p.diagnostics || []).slice(0, 2);
    if (!ex.length && !dg.length) return null;
    var s = C.section('05', 'Отчёты');
    dg.forEach(function (x) {
      var r = C.el('div', 'c-row'), t = C.el('div', 'c-row-t');
      t.appendChild(C.el('div', '', (C.subjectLabel(x.subject) || 'Диагностика') + (x.score != null ? ': ' + x.score + (x.target_score ? ' из ' + x.target_score : '') : '')));
      if (x.summary) t.appendChild(C.el('div', 'c-row-s', String(x.summary).slice(0, 200)));
      r.appendChild(t); r.appendChild(C.el('span', 'c-row-s', when(x.created_at))); s.appendChild(r);
    });
    ex.forEach(function (x) {
      var r = C.el('div', 'c-row'), t = C.el('div', 'c-row-t');
      var sc = x.test_score != null ? x.test_score : x.primary_score;
      t.appendChild(C.el('div', '', (x.exam_type || 'Экзамен') + (C.subjectLabel(x.subject) ? ' · ' + C.subjectLabel(x.subject) : '') + (sc != null ? ': ' + sc + (x.max_score ? ' из ' + x.max_score : '') : '')));
      r.appendChild(t); r.appendChild(C.el('span', 'c-row-s', when(x.exam_date))); s.appendChild(r);
    });
    return s;
  }

  function paint(kid, d) {
    var frag = document.createDocumentFragment(), kids = dash.students || [];
    var first = String(dash.parent && dash.parent.name || '').split(/\s+/)[0];
    frag.appendChild(C.el('h1', 'c-hello', first ? 'Здравствуйте, ' + first + '!' : 'Здравствуйте!'));
    frag.appendChild(C.el('p', 'cab-sub', kids.length > 1 ? 'Выберите ребёнка, чтобы увидеть его занятия.' : 'Вот что сейчас с занятиями ' + (kid.name || 'ребёнка') + '.'));
    if (kids.length > 1) {
      var bar = C.el('div', 'c-kids'); bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Ребёнок');
      kids.forEach(function (k) {
        var b = C.el('button', '', k.name || 'Ребёнок'); b.type = 'button'; b.setAttribute('aria-pressed', String(num(k.id) === num(kid.id)));
        b.addEventListener('click', function () { sel = k.id; try { sessionStorage.setItem('adelia:parent:kid', String(k.id)); } catch (e) {} load(); });
        bar.appendChild(b);
      });
      frag.appendChild(bar);
    }
    frag.appendChild(lessonSection(kid));
    if (d) {
      frag.appendChild(attendSection(d));
      var ps = progSection(d); if (ps) frag.appendChild(ps);
      frag.appendChild(paySection(d));
      var rs = repSection(d); if (rs) frag.appendChild(rs);
    } else frag.appendChild(C.error('Не получилось загрузить данные ребёнка.', load));
    body.replaceChildren(frag);
  }

  function load() {
    if (loading) return Promise.resolve(); loading = true;
    return C.api('/parent/dashboard').then(function (dd) {
      dash = dd || {}; var kids = dash.students || [];
      if (!kids.length) { body.replaceChildren(C.el('h1', 'c-hello', 'Здравствуйте!'), C.empty('К вашему кабинету пока не подключён ребёнок. Напишите Аделии, и мы поможем.')); return; }
      if (sel == null) { try { sel = Number(sessionStorage.getItem('adelia:parent:kid')) || null; } catch (e) {} }
      var kid = kids.filter(function (k) { return num(k.id) === num(sel); })[0] || kids[0]; sel = kid.id;
      return C.api('/parent/student?id=' + encodeURIComponent(kid.id)).then(function (d) { paint(kid, d); }, function (e) { if (e.status === 401) throw e; paint(kid, null); });
    }).catch(function (e) {
      if (e.status === 401) { location.replace(C.classic(P)); return; }
      body.replaceChildren(C.error(e.message || 'Не получилось загрузить кабинет.', load));
    }).then(function () { loading = false; });
  }

  C.boot({
    role: 'parent', menu: MENU, active: 'home', notifications: C.legacy('parent', 'messages'),
    render: function (main) {
      body = document.createElement('div'); body.setAttribute('aria-live', 'polite');
      for (var i = 0; i < 3; i++) body.appendChild(C.el('div', 'c-skel'));
      main.appendChild(body); document.title = 'Главная — Аделия';
      document.addEventListener('visibilitychange', function () { if (!document.hidden && dash) load(); });
      return load();
    }
  });
})();
</script>
</body>
</html>
