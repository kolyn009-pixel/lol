<!doctype html><html lang="ru"><head><meta charset="utf-8"><script data-adelia-boot-guard="20261022">/* Embedded before stylesheets so stalled defer scripts cannot block recovery. */
(() => {
  'use strict';
  if (window.AdeliaTeacherBootGuard) return;
  window.AdeliaTeacherBootGuard = true;
  const failed = new Set();
  window.addEventListener('error', event => {
    const raw = event.target?.src || event.target?.href;
    if (!raw) return;
    try {
      const url = new URL(raw, location.origin);
      if (url.origin === location.origin) failed.add(url.pathname.split('/').pop());
    } catch (_) {}
  }, true);
  setTimeout(() => {
    const root = document.querySelector('#app');
    if (!root || !root.querySelector(':scope > .loading')) return;
    root.innerHTML = '<section class="error" style="padding:24px;background:#fff;border:1px solid #ded6ed;border-radius:18px;font:16px system-ui;color:#282132"><b>Не удалось завершить загрузку кабинета</b><p>Проверьте соединение и повторите загрузку. Если проблема повторится, передайте преподавателю результат проверки ниже.</p><p data-boot-details role="status"></p><div style="display:flex;gap:12px;flex-wrap:wrap"><button type="button" data-boot-check>Проверить соединение</button><button type="button" data-boot-reload>Обновить файлы кабинета</button></div></section>';
    const panel = root.firstElementChild;
    const details = panel.querySelector('[data-boot-details]');
    details.textContent = failed.size ? 'Не загрузились файлы: ' + [...failed].join(', ') : 'Загрузка интерфейса или данных не завершилась.';
    panel.querySelector('[data-boot-check]').onclick = async event => {
      const button = event.currentTarget;
      button.disabled = true;
      const ctrl = new AbortController();
      let timer;
      try {
        const request = (async () => {
          const response = await fetch('/api/health', { cache: 'no-store', credentials: 'same-origin', signal: ctrl.signal });
          const data = await response.json();
          if (!response.ok || data.ok !== true) throw new Error('health_failed');
        })();
        await Promise.race([request, new Promise((_, reject) => { timer = setTimeout(() => { ctrl.abort(); reject(new Error('timeout')); }, 5000); })]);
        details.textContent = 'Сервер отвечает. ' + (failed.size ? 'Не загрузились файлы: ' + [...failed].join(', ') : 'Нужно повторить загрузку кабинета.');
      } catch (_) { details.textContent = 'Проверка соединения с сервером не прошла. Попробуйте другую сеть и повторите проверку.'; }
      finally { clearTimeout(timer); button.disabled = false; }
    };
    panel.querySelector('[data-boot-reload]').onclick = async event => {
      event.currentTarget.disabled = true;
      try {
        if ('caches' in window) for (const name of await caches.keys()) {
          if (!name.startsWith('adelia-')) continue;
          const cache = await caches.open(name);

            const url = new URL(request.url);

        }
      } catch (_) {}
      const url = new URL(location.href);
      url.searchParams.set('boot_refresh', String(Date.now()));
      location.replace(url.href);
    };
  }, 18000);
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6847f5"><meta name="description" content="Аделия — кабинет преподавателя"><meta name="application-name" content="Аделия"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Аделия"><meta name="mobile-web-app-capable" content="yes"><title>Преподаватель — Аделия</title><link rel="manifest" href="/app/teacher-manifest.webmanifest?v=20260925-pwa4"><link rel="stylesheet" href="/app/teacher_lesson_flow.css?v=20260915-clean11"><link rel="stylesheet" href="/app/teacher_lesson_context.css?v=20260915-clean11"><link rel="stylesheet" href="/app/formulas.css?v=20260918-polish3"><link rel="stylesheet" href="/app/teacher_finance.css?v=20261006-reverse1"><link rel="stylesheet" href="/app/teacher_invoices.css?v=20260915-invoices1"><link rel="stylesheet" href="/app/teacher_finance_polish.css?v=20260918-polish2"><link rel="stylesheet" href="/app/teacher_messages_stage10.css?v=20260928-messenger2"><link rel="stylesheet" href="/app/teacher_messages_polish.css?v=20261004-messenger3"><link rel="stylesheet" href="/app/teacher_schedule_settings.css?v=20260918-dayoff-toggle1"><link rel="stylesheet" href="/app/teacher_health.css?v=20260918-health3"><link rel="stylesheet" href="/app/teacher_clean.css?v=20260915-clean11"><link rel="stylesheet" href="/app/teacher_clean_sections.css?v=20260915-clean11"><link rel="stylesheet" href="/app/teacher_clean7.css?v=20260915-clean11"><link rel="stylesheet" href="/app/teacher_students_clean8.css?v=20260915-clean11"><link rel="stylesheet" href="/app/teacher_students_polish.css?v=20260917-students1"><link rel="stylesheet" href="/app/teacher_homework_polish.css?v=20260917-homework1"><link rel="stylesheet" href="/app/teacher_groups_polish.css?v=20260918-polish2"><link rel="stylesheet" href="/app/teacher_libra
